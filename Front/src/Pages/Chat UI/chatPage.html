<div
  class="h-screen w-full flex overflow-hidden bg-linear-to-br from-blue-100 via-white to-indigo-100 p-6 gap-6 font-sans"
>
  <aside
    class="w-1/3 lg:w-1/4 h-full bg-white border border-blue-200 shadow-[0_15px_40px_-12px_rgba(37,99,235,0.15)] overflow-hidden transition-all duration-300"
  >
    <div
      class="absolute w-40 h-40 bg-blue-400/10 blur-3xl -top-10 -left-10 pointer-events-none"
    ></div>

    <app-chat-sidebar (userSelected)="onUserSelected($event)"></app-chat-sidebar>
  </aside>

  <main
    class="flex-1 h-full relative bg-white border border-blue-200 shadow-[0_15px_40px_-12px_rgba(37,99,235,0.15)] overflow-hidden"
  >
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-blue-300/10 rounded-full blur-3xl"></div>
    <div
      class="absolute -bottom-32 -left-32 w-80 h-80 bg-indigo-300/10 rounded-full blur-3xl"
    ></div>

    <div
      class="absolute inset-0 opacity-[0.02] bg-[linear-gradient(to_right,#2563eb_1px,transparent_1px),linear-gradient(to_bottom,#2563eb_1px,transparent_1px)] bg-size-[40px_40px]"
    ></div>

    <div class="relative h-full w-full">
      <app-chat-window class="h-full w-full" [receiverid]="receiverid" [senderid]="senderid()">
      </app-chat-window>
    </div>
  </main>
</div>
