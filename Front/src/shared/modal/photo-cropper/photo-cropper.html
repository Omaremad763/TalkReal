<input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" hidden />

<div
  *ngIf="showModal"
  class="fixed inset-0 z-[100] flex items-center justify-center bg-blue-950/80 p-4 animate-in fade-in duration-300 backdrop-blur-sm"
>
  <div
    class="w-full max-w-2xl bg-white border-2 border-blue-600 rounded-none shadow-2xl overflow-hidden flex flex-col transform animate-in slide-in-from-top-10"
  >
    <div class="h-16 bg-blue-600 px-6 flex items-center justify-between shrink-0">
      <h2 class="text-white font-black uppercase text-sm tracking-widest">Adjust Profile Photo</h2>
      <button
        (click)="cancelUpload()"
        class="text-white hover:text-red-300 transition-colors font-bold text-2xl"
      >
        ×
      </button>
    </div>

    <div class="p-4 md:p-8 bg-slate-50 border-b border-blue-100 flex-grow overflow-auto">
      <div
        class="border-2 border-dashed border-blue-200 p-2 bg-white shadow-inner min-h-[300px] flex items-center justify-center"
      >
        <image-cropper
          [imageChangedEvent]="imageChangedEvent"
          [maintainAspectRatio]="true"
          [aspectRatio]="30 / 18"
          [cropperMinWidth]="128"
          [roundCropper]="false"
          [canvasRotation]="rotation"
          [autoCrop]="true"
          [containWithinAspectRatio]="true"
          [alignImage]="'center'"
          [output]="'blob'"
          format="jpeg"
          (imageCropped)="onImageCropped($event)"
          class="max-h-[50vh] w-full"
        ></image-cropper>
      </div>
    </div>

    <div class="p-6 bg-white flex flex-col md:flex-row items-center justify-between gap-4 shrink-0">
      <div class="flex items-center gap-2 border border-blue-100 p-2 bg-slate-50">
        <span class="text-slate-500 text-[10px] font-black uppercase tracking-wider px-2"
          >Rotate:</span
        >
        <button
          (click)="rotateLeft()"
          class="w-10 h-10 border border-blue-100 bg-white flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"
            />
          </svg>
        </button>
        <button
          (click)="rotateRight()"
          class="w-10 h-10 border border-blue-100 bg-white flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"
            />
          </svg>
        </button>
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="cancelUpload()"
          class="px-6 py-3 text-xs font-black uppercase tracking-widest text-slate-600 hover:bg-slate-100 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="confirmUpload()"
          class="px-8 py-3 text-xs font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all shadow-md shadow-blue-200"
        >
          Confirm & Upload
        </button>
      </div>
    </div>
  </div>
</div>
